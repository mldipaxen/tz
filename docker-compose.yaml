services:
  app:
    build:
      context: ./routes
    ports:
      - "8888:8080"
    depends_on:
      - db
    env_file:
      - var.env
    environment:
      - DATABASE_URL=${DATABASE_URL}

  db:
    image: postgres:15
    ports:
      - "5444:5432"

  alembic:
    build:
      context: .
      dockerfile: alembic.Dockerfile
    depends_on:
      - db
    env_file:
      - var.env
    environment:
      - DATABASE_URL=${DATABASE_URL}